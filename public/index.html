<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moshi Suits Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 15px; background: #f4f4f4; margin: 0; }
        .card { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input, select, button { width: 100%; padding: 12px; margin: 8px 0 15px 0; box-sizing: border-box; font-size: 16px; }
        button { background: #1a202c; color: #fff; border: none; font-weight: bold; border-radius: 6px; cursor: pointer; }
        button.print-btn { background: #2b6cb0; }
        button.sell-btn { background: #38a169; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; font-size: 14px; }
        .grid-reports { display: flex; gap: 10px; flex-wrap: wrap; }
        .report-box { flex: 1; min-width: 45%; background: #edf2f7; padding: 15px; border-radius: 6px; text-align: center; }
        .report-box h4 { margin: 0 0 5px 0; color: #4a5568; }
        .report-box p { margin: 0; font-size: 18px; font-weight: bold; }
        .add-link { float: right; font-size: 13px; color: #2b6cb0; text-decoration: none; font-weight: bold; }
        
        .filter-bar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; background: #edf2f7; padding: 10px; border-radius: 6px; }
        .filter-bar select { width: auto; flex-grow: 1; margin: 0; padding: 8px; font-size: 14px; }
        .filter-bar button { width: auto; margin: 0; padding: 8px 15px; font-size: 14px; }

        @media print {
            .no-print { display: none !important; }
            body { background: white; }
            .card { box-shadow: none; border: 1px solid #ccc; page-break-inside: avoid; }
        }
    </style>
</head>
<body>

    <h2 style="text-align: center;">👔 Moshi Suits Tracker</h2>

    <div class="card no-print" id="editCard" style="display: none; border: 2px solid #ecc94b; background: #fffff0;">
        <h3 style="color: #b7791f;">✏️ Edit Wrong Entry</h3>
        <input type="hidden" id="editId">

        <label>Correct Size:</label>
        <select id="editSize">
            <option value="44">44</option><option value="46">46</option><option value="48">48</option>
            <option value="50">50</option><option value="52">52</option><option value="54">54</option>
            <option value="56">56</option><option value="58">58</option><option value="60">60</option>
            <option value="62">62</option><option value="64">64</option><option value="66">66</option>
        </select>
        <label>Correct Color:</label>
        <select id="editColor"></select>
        <label>Correct Design:</label>
        <select id="editDesign"></select>
        <label>Correct Stock Quantity:</label>
        <input type="number" id="editStock">

        <div style="display: flex; gap: 10px;">
            <button style="background: #ecc94b; color: black;" onclick="submitEdit()">💾 Save Changes</button>
            <button style="background: #a0aec0;" onclick="cancelEdit()">❌ Cancel</button>
        </div>
    </div>

    <div class="card no-print">
        <h3>➕ Add to Stock</h3>
        <label>Size:</label>
        <select id="size">
            <option value="44">44</option><option value="46">46</option><option value="48">48</option>
            <option value="50">50</option><option value="52">52</option><option value="54">54</option>
            <option value="56">56</option><option value="58">58</option><option value="60">60</option>
            <option value="62">62</option><option value="64">64</option><option value="66">66</option>
        </select>

        <label>Color: <a href="#" class="add-link" onclick="addNewColor()">+ Add New Color</a></label>
        <select id="color"></select>

        <label>Design: <a href="#" class="add-link" onclick="addNewDesign()">+ Add New Design</a></label>
        <select id="design"></select>

        <label>Quantity to Add:</label>
        <input type="number" id="stock" value="1">

        <button onclick="addSuit()">Save to Stock</button>
    </div>

    <div class="card no-print">
        <h3>🛒 Register a Sale</h3>
        <label>Select Item Sold:</label>
        <select id="saleItem"></select>
        <label>Quantity Sold:</label>
        <input type="number" id="saleQty" value="1">
        <label>Total Price (e.g. 150000):</label>
        <input type="number" id="salePrice" placeholder="Enter total amount">
        <button class="sell-btn" onclick="registerSale()">Record Sale</button>
    </div>

    <div class="card">
        <h3>📊 Sales Reports</h3>
        <button class="print-btn no-print" onclick="window.print()">🖨️ Print Reports & Stock</button>
        <div class="grid-reports" id="summaryReports"></div>
        <h4 style="margin-top: 20px;">🔥 Top 5 Best Sellers</h4>
        <table>
            <thead><tr><th>Suit Detail</th><th>Total Sold</th></tr></thead>
            <tbody id="bestSellersBody"></tbody>
        </table>
    </div>

    <div class="card">
        <h3>📦 Current Suit Inventory</h3>
        
        <div class="filter-bar no-print">
            <select id="filterSize" onchange="applyFilters()">
                <option value="ALL">All Sizes</option>
                <option value="44">44</option><option value="46">46</option><option value="48">48</option>
                <option value="50">50</option><option value="52">52</option><option value="54">54</option>
                <option value="56">56</option><option value="58">58</option><option value="60">60</option>
                <option value="62">62</option><option value="64">64</option><option value="66">66</option>
            </select>
            <select id="filterColor" onchange="applyFilters()"><option value="ALL">All Colors</option></select>
            <select id="filterDesign" onchange="applyFilters()"><option value="ALL">All Designs</option></select>
            <select id="filterStock" onchange="applyFilters()">
                <option value="ALL">All Stock</option>
                <option value="IN">In Stock Only</option>
                <option value="OUT">Out of Stock (0)</option>
            </select>
            <select id="sortBy" onchange="applyFilters()">
                <option value="default">Sort: Newest</option>
                <option value="size">Sort: Size</option>
                <option value="color">Sort: Color</option>
                <option value="design">Sort: Design</option>
            </select>
            <button style="background: #4a5568;" onclick="resetFilters()">🔄 Clear</button>
        </div>

        <table>
            <thead><tr><th>Size</th><th>Color</th><th>Design</th><th>In Stock</th><th class="no-print">Action</th></tr></thead>
            <tbody id="inventoryBody"></tbody>
        </table>
    </div>

    <script>
        let allSuitsData = []; 

        async function loadDashboard() {
            await fetchOptions();
            await fetchSuits();
            await fetchReports();
        }

        async function fetchOptions() {
            // Save current selections so they are "sticky"
            const currentColor = document.getElementById('color').value;
            const currentDesign = document.getElementById('design').value;

            const res = await fetch('/api/options');
            const data = await res.json();
            
            // Populate Dropdowns
            const colorOptions = data.colors.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
            const designOptions = data.designs.map(d => `<option value="${d.name}">${d.name}</option>`).join('');
            
            document.getElementById('color').innerHTML = colorOptions;
            document.getElementById('design').innerHTML = designOptions;
            
            // Populate Filters
            document.getElementById('filterColor').innerHTML = `<option value="ALL">All Colors</option>` + colorOptions;
            document.getElementById('filterDesign').innerHTML = `<option value="ALL">All Designs</option>` + designOptions;

            // Restore the "sticky" selections if they existed
            if (currentColor) document.getElementById('color').value = currentColor;
            if (currentDesign) document.getElementById('design').value = currentDesign;
        }

        // Add New Options
        async function addNewColor() {
            const newColor = prompt("Enter the name of the new color:");
            if(newColor && newColor.trim() !== "") {
                await fetch('/api/colors', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: newColor.trim() }) });
                fetchOptions(); 
            }
        }
        async function addNewDesign() {
            const newDesign = prompt("Enter the name of the new design:");
            if(newDesign && newDesign.trim() !== "") {
                await fetch('/api/designs', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: newDesign.trim() }) });
                fetchOptions(); 
            }
        }

        // Fetch and Render Inventory
        async function fetchSuits() {
            const res = await fetch('/api/suits');
            allSuitsData = await res.json();
            
            applyFilters(); // Apply any active filters immediately

            const saleSelect = document.getElementById('saleItem');
            saleSelect.innerHTML = '<option value="">-- Select a Suit --</option>';
            allSuitsData.forEach(suit => {
                if(suit.stock > 0) {
                    saleSelect.innerHTML += `<option value="${suit.id}">Size ${suit.size} - ${suit.color} ${suit.design} (Stock: ${suit.stock})</option>`;
                }
            });
        }

        function renderInventory(data) {
            const tbody = document.getElementById('inventoryBody');
            tbody.innerHTML = '';
            data.forEach(suit => {
                const rowStyle = suit.stock === 0 ? "background-color: #fff5f5; color: #c53030;" : "";
                tbody.innerHTML += `
                <tr style="${rowStyle}">
                    <td>${suit.size}</td><td>${suit.color}</td><td>${suit.design}</td><td><b>${suit.stock}</b></td>
                    <td class="no-print">
                        <button style="background: #ecc94b; color: black; padding: 5px; margin: 0; font-size: 12px; width: auto;" 
                        onclick="startEdit(${suit.id}, '${suit.size}', '${suit.color}', '${suit.design}', ${suit.stock})">✏️ Edit</button>
                    </td>
                </tr>`;
            });
        }

        // SORT AND FILTER LOGIC
        function applyFilters() {
            let filtered = [...allSuitsData];
            
            const fSize = document.getElementById('filterSize').value;
            const fColor = document.getElementById('filterColor').value;
            const fDesign = document.getElementById('filterDesign').value;
            const fStock = document.getElementById('filterStock').value;
            const sortMode = document.getElementById('sortBy').value;

            // Filtering
            if(fSize !== "ALL") filtered = filtered.filter(s => s.size === fSize);
            if(fColor !== "ALL") filtered = filtered.filter(s => s.color === fColor);
            if(fDesign !== "ALL") filtered = filtered.filter(s => s.design === fDesign);
            if(fStock === "OUT") filtered = filtered.filter(s => s.stock === 0);
            if(fStock === "IN") filtered = filtered.filter(s => s.stock > 0);

            // Sorting
            if(sortMode === "size") {
                filtered.sort((a,b) => parseInt(a.size) - parseInt(b.size));
            } else if(sortMode === "color") {
                filtered.sort((a,b) => a.color.localeCompare(b.color));
            } else if(sortMode === "design") {
                filtered.sort((a,b) => a.design.localeCompare(b.design));
            }

            renderInventory(filtered);
        }

        function resetFilters() {
            document.getElementById('filterSize').value = "ALL";
            document.getElementById('filterColor').value = "ALL";
            document.getElementById('filterDesign').value = "ALL";
            document.getElementById('filterStock').value = "ALL";
            document.getElementById('sortBy').value = "default";
            applyFilters();
        }

        // Edit Functions
        function startEdit(id, size, color, design, stock) {
            const password = prompt("Please enter the Admin Password to edit:");
            if (password !== "Qwerty") { alert("Incorrect Password!"); return; }

            document.getElementById('editCard').style.display = 'block';
            document.getElementById('editId').value = id;
            document.getElementById('editSize').value = size;
            document.getElementById('editColor').innerHTML = document.getElementById('color').innerHTML;
            document.getElementById('editColor').value = color;
            document.getElementById('editDesign').innerHTML = document.getElementById('design').innerHTML;
            document.getElementById('editDesign').value = design;
            document.getElementById('editStock').value = stock;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function submitEdit() {
            const id = document.getElementById('editId').value;
            const size = document.getElementById('editSize').value;
            const color = document.getElementById('editColor').value;
            const design = document.getElementById('editDesign').value;
            const stock = document.getElementById('editStock').value;

            await fetch(`/api/suits/${id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ size, color, design, stock }) });
            alert("Entry successfully corrected!");
            document.getElementById('editCard').style.display = 'none';
            loadDashboard(); 
        }

        function cancelEdit() { document.getElementById('editCard').style.display = 'none'; }

        // Add Stock Function
        async function addSuit() {
            const size = document.getElementById('size').value;
            const color = document.getElementById('color').value;
            const design = document.getElementById('design').value;
            const stock = document.getElementById('stock').value;

            if(!stock || stock <= 0) return alert("Enter a valid quantity!");

            await fetch('/api/suits', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ size, color, design, stock }) });
            
            // Note: We intentionally do NOT reset size, color, or design here to keep them sticky!
            document.getElementById('stock').value = 1; // Only reset the quantity back to 1
            
            alert("Stock Added!");
            loadDashboard();
        }

        // Register Sale Function
        async function registerSale() {
            const suit_id = document.getElementById('saleItem').value;
            const quantity = document.getElementById('saleQty').value;
            const total_price = document.getElementById('salePrice').value;

            if(!suit_id) return alert("Please select a suit to sell.");
            if(!quantity || quantity <= 0) return alert("Enter a valid quantity.");
            if(!total_price) return alert("Enter the total price.");

            await fetch('/api/sales', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ suit_id, quantity, total_price }) });
            document.getElementById('salePrice').value = ''; 
            alert("Sale Recorded successfully!");
            loadDashboard();
        }

        // Fetch Reports
        async function fetchReports() {
            const sumRes = await fetch('/api/reports/summary');
            const summary = await sumRes.json();
            
            document.getElementById('summaryReports').innerHTML = `
                <div class="report-box"><h4>Today</h4><p>${summary.daily.qty} items<br>TSh ${summary.daily.revenue}</p></div>
                <div class="report-box"><h4>This Week</h4><p>${summary.weekly.qty} items<br>TSh ${summary.weekly.revenue}</p></div>
                <div class="report-box"><h4>This Month</h4><p>${summary.monthly.qty} items<br>TSh ${summary.monthly.revenue}</p></div>
                <div class="report-box"><h4>This Year</h4><p>${summary.yearly.qty} items<br>TSh ${summary.yearly.revenue}</p></div>
            `;

            const bestRes = await fetch('/api/reports/bestsellers');
            const bestSellers = await bestRes.json();
            
            const bestBody = document.getElementById('bestSellersBody');
            bestBody.innerHTML = '';
            bestSellers.forEach(item => {
                bestBody.innerHTML += `<tr><td>Size ${item.size} ${item.color} ${item.design}</td><td><b>${item.total_sold}</b></td></tr>`;
            });
        }

        loadDashboard(); 
    </script>
</body>
                          </html>
